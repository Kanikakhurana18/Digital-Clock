<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="shortcut icon" href="images.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="clock clock1">
            <div id="hrs">
                00
            </div>
            <div id="colon">
                <pre>: :</pre>
            </div>
            <div id="mins">
                00
            </div>
        </div>
        <div class="clock clock2">
            <div class="date">
                <span id="dat">01</span> <span id="mon">March</span>
            </div>
            <div id="year">
                2005
            </div>
            <div id="day">
                Sunday
            </div>
            <div id="am-pm">
                AM
            </div>
            <div id="sec">
                <span id="seconds">00</span>
                <small>sec</small>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
